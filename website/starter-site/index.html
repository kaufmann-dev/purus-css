<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Starter site | Minimalist CSS Framework. No JavaScript. Raw CSS. 15 KB minified."
    />
    <meta name="author" content="David Kaufmann" />
    <title>Starter site | Purus CSS</title>
    <link rel="apple-touch-icon" href="../media/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../media/logo.svg" />
    <link rel="icon" type="image/x-icon" href="../media/favicon.ico" />
    <script>
      (() => {
        const theme = localStorage.getItem("purus-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="../css/purus.min.css" />
    <link rel="stylesheet" type="text/css" href="../css/website.css" />
    <script defer src="../js/theme.js"></script>
  </head>
  <body>
    <nav class="border-bottom p-nav text-center bg-white-darkest">
      <ul>
        <li>
          <a class="button" href="..">Home</a>
          <a class="button" href="https://github.com/kaufmann-dev/purus-css"
            >GitHub</a
          >
        </li>
      </ul>
    </nav>
    <div class="container fill-vertical-space">
      <div class="site-toolbar">
        <div class="theme-control">
          <label for="theme">Theme</label>
          <select id="theme" data-theme-selector>
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
      <h1>Starter site</h1>
      <p>Lorem Ipsum.</p>
    </div>

    <footer>
      <p>
        <a href="https://github.com/kaufmann-dev/purus-css">GitHub</a> ·
        <a href="https://github.com/kaufmann-dev/purus-css/blob/main/LICENSE"
          >License</a
        >
        ·
        <a href="https://legal.kaufmann.dev/imprint?site=puruscss.kaufmann.dev"
          >Imprint</a
        >
        ·
        <a href="https://legal.kaufmann.dev/privacy?site=puruscss.kaufmann.dev"
          >Privacy</a
        >
      </p>
    </footer>
  </body>
</html>
