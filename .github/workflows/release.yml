name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run validate:dist
      - run: npm run validate:package
      - run: npm run size
      - run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          files: purus-css-*.tgz
      - run: npm publish
