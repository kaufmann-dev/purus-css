name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify complete CSS composition
        run: |
          mkdir -p tmp
          {
            cat css/purus.classes.css
            printf '\n'
            sed -n '/^\/\*! DROP-IN CSS \*\//,$p' css/purus.drop-in.css
          } > tmp/purus.css
          diff -u css/purus.css tmp/purus.css

      - name: Validate HTML
        run: npx --yes html-validate@11.5.2 'website/**/*.html' 'website/*.html'

      - name: Check formatting
        run: >
          npx --yes prettier@3.8.3 --check
          README.md
          website/index.html
          website/demo/index.html
          website/starter-site/index.html
          website/css/website.css
          css/purus.css
          css/purus.classes.css
          css/purus.drop-in.css
          .htmlvalidate.json
          .github/workflows/verify.yml

      - name: Verify minified CSS
        run: |
          mkdir -p tmp/minified
          for source in css/purus.css css/purus.classes.css css/purus.drop-in.css; do
            output="tmp/minified/$(basename "${source%.css}.min.css")"
            npx --yes @parcel/css-cli@1.13.1 --minify --output-file "$output" "$source"
            diff -u "${source%.css}.min.css" "$output"
          done
          diff -u css/purus.min.css website/css/purus.min.css

      - name: Verify project slogan
        run: |
          grep -Fq 'No JavaScript. Raw CSS.' README.md
          grep -Fq 'No JavaScript. Raw CSS.' website/index.html
          grep -Fq 'No JavaScript. Raw CSS.' website/demo/index.html
          grep -Fq 'No JavaScript. Raw CSS.' website/starter-site/index.html
