name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: >
          npx --yes prettier@3.8.3 --check
          README.md
          css/purus.css
          .htmlvalidate.json
          .github/workflows/verify.yml

      - name: Verify minified CSS
        run: |
          mkdir -p tmp/minified
          npx --yes @parcel/css-cli@1.13.1 --minify --output-file tmp/minified/purus.min.css css/purus.css
          diff -u css/purus.min.css tmp/minified/purus.min.css

      - name: Verify single artifact and local resources
        run: |
          test ! -e css/purus.classes.css
          test ! -e css/purus.classes.min.css
          test ! -e css/purus.drop-in.css
          test ! -e css/purus.drop-in.min.css
          ! grep -RE '(@import[^;]*(https?:)?//|url\([^)]*(https?:)?//)' css

      - name: Verify displayed size
        run: |
          size="$(wc -c < css/purus.min.css | awk '{ printf "%.0f KB", $1 / 1024 }')"
          grep -Fq "$size minified" README.md

      - name: Verify project slogan
        run: |
          grep -Fq 'No JavaScript. Raw CSS.' README.md
